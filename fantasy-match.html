<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b62dea">
  <meta name="description" content="Fantasy Match, le jeu magique de l'équipe Fantasy Kids Events.">
  <title>Fantasy Match · Fantasy Kids Events</title>
  <link rel="stylesheet" href="fantasy-match.css">
  <link rel="stylesheet" href="fantasy-match-premium.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="fantasy-match.js"></script>
</head>
<body>
  <div class="fm-bg-stars" aria-hidden="true"></div>
  <main class="fm-shell">
    <header class="fm-header">
      <a class="fm-brand" href="index.html" aria-label="Revenir à l'agenda Fantasy Kids Events">
        <img src="logo.png" alt="Fantasy Kids Events">
      </a>
      <h1 class="fm-game-logo"><span>Fantasy</span><strong>Match</strong><i aria-hidden="true">✦</i></h1>
      <button class="fm-settings" id="rulesBtn" aria-label="Règles du jeu">?</button>
    </header>

    <div class="fm-title-wrap">
      <button id="levelsBtn" class="fm-level-btn" title="Choisir un niveau">Niveau <b id="levelValue">1</b></button>
      <div class="fm-world" id="worldName">Le Royaume des Étoiles</div>
    </div>

    <section class="fm-status" aria-label="Progression et vies">
      <div class="fm-progress">
        <div class="fm-progress-top"><span>Progression du niveau</span><span id="progressValue">0 / 18</span></div>
        <div class="fm-track">
          <div class="fm-progress-fill" id="progressFill"></div>
          <div class="fm-stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
        </div>
      </div>
      <div class="fm-lives"><div id="hearts" class="fm-hearts" aria-label="Cinq vies"></div><small id="lifeTimer">5 / 5 vies</small></div>
    </section>

    <section class="fm-objective" aria-label="Objectif et coups restants">
      <div class="fm-objective-icon" id="goalIcon"></div>
      <div class="fm-objective-label"><strong><span id="goalRemain">18</span> <span id="goalName">étoiles</span></strong></div>
      <div class="fm-moves"><strong id="movesValue">24</strong><small>coups</small></div>
    </section>

    <div class="fm-board-wrap">
      <div class="fm-board" id="gameBoard" role="grid" aria-label="Plateau Fantasy Match, huit cases sur huit"></div>
      <div class="fm-board-overlay hidden" id="boardOverlay"><span id="boardOverlayText">Préparation…</span></div>
    </div>

    <p class="fm-tip" id="gameTip">Aligne trois symboles identiques pour récolter ta magie</p>
    <div class="fm-powerups" aria-label="Bonus spéciaux">
      <button id="boostColor" class="fm-power" title="Effacer toutes les pièces identiques" aria-label="Bonus magie"><span class="fm-bubble" aria-hidden="true"></span><b id="colorCount">3</b></button>
      <button id="boostBomb" class="fm-power" title="Effacer neuf cases" aria-label="Bonus bombe"><span class="fm-bubble" aria-hidden="true"></span><b id="bombCount">3</b></button>
      <button id="boostShuffle" class="fm-power" title="Mélanger le plateau" aria-label="Bonus mélanger"><span class="fm-bubble" aria-hidden="true"></span><b id="shuffleCount">3</b></button>
    </div>

    <nav class="fm-nav" aria-label="Navigation Fantasy Match">
      <button class="active" data-screen="play"><span aria-hidden="true"><svg viewBox="0 0 40 36" fill="currentColor"><path d="M8 9h24c4 0 6 4 7 13l1 7c0 3-3 5-6 3l-9-8H15L6 32c-3 2-6 0-6-3l1-7C2 13 4 9 8 9Z" opacity=".9"/><path d="M10 15v12M4 21h12" stroke="#7548d3" stroke-width="3.5" stroke-linecap="round"/><circle cx="28" cy="18" r="2.3" fill="#fa65c8"/><circle cx="33" cy="23" r="2.3" fill="#39bcff"/></svg></span>Jouer</button>
      <button data-screen="ranking"><span aria-hidden="true"><svg viewBox="0 0 40 40" fill="currentColor"><path d="M11 4h18v7c0 9-4 14-9 15-5-1-9-6-9-15V4ZM11 8H5v5c0 7 5 11 12 12M29 8h6v5c0 7-5 11-12 12" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 26h4v7h8v4H10v-4h8z"/></svg></span>Classement</button>
      <button data-screen="team"><span aria-hidden="true"><svg viewBox="0 0 44 40" fill="currentColor"><circle cx="22" cy="10" r="7"/><circle cx="7" cy="16" r="5"/><circle cx="37" cy="16" r="5"/><path d="M8 35c0-8 6-14 14-14s14 6 14 14v2H8zM0 35v-3c0-6 4-10 9-11 2 1 4 2 5 4-2 3-4 6-4 10H0Zm44 0h-10c0-4-2-7-4-10 1-2 3-3 5-4 5 1 9 5 9 11z"/></svg></span>Équipe</button>
    </nav>
    <div class="fm-sync" id="syncStatus" aria-live="polite">Sauvegarde en préparation…</div>
  </main>

  <div class="fm-modal-backdrop hidden" id="dialogBackdrop" role="presentation">
    <section class="fm-dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <button class="fm-dialog-x" id="dialogClose" aria-label="Fermer">×</button>
      <div class="fm-dialog-sparkle" id="dialogSymbol">✦</div>
      <h2 id="dialogTitle">Fantasy Match</h2>
      <div id="dialogContent"></div>
      <div class="fm-dialog-actions" id="dialogActions"></div>
    </section>
  </div>
  <div class="fm-toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
