html,body{width:100%;margin:0;overflow-x:hidden}main{width:100%;max-width:480px;min-height:100svh;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at top,#47205d,#130923 75%)}

.progress-note{display:none}

.hero svg{display:block;width:100%;height:100%;max-width:100%;overflow:hidden}
.home-actions{flex:none;display:grid;gap:2px;justify-items:center}
.artbtn{display:block;border:0;padding:0;background:none;min-width:0;line-height:0;touch-action:manipulation}

.home-actions .artbtn{width:min(100%,280px);height:43px}

.game-header{flex:0 0 auto;height:clamp(105px,17dvh,145px);aspect-ratio:auto;background-size:100% 100%}
.game-title{font-size:clamp(16px,5vw,24px);line-height:1.1}

.game-hud{height:40%;gap:3px}.game-hud>div{gap:1px;border-width:1.5px}

.game-hud .objective{gap:3px}.tiny{width:20px;height:20px}
.board-frame{flex:1 1 0;min-height:0;display:grid;place-items:center;padding:8px;background-size:100% 100%;overflow:hidden}
.board-frame:before{inset:5px}

.cell.player{z-index:5}.cell.player img{animation:none;inset:-8% -9% -3%;width:118%;height:111%;object-fit:contain}

.game-footer .hit{top:0!important;height:74%!important}

.dialog{max-height:90dvh;overflow:auto}

function start(n){if(!Number.isInteger(n)||n<1||n>progress.level)return;mapBase=0;close();round=generate(n);history=[];hintPath=[];page('game');render();say('Glisse vers un carrefour ou touche un passage. Trouve la clé, le coffre et le portail.');}function say(t){$('notice').textContent=t}
function fitBoard(){if(!round||screen!=='game')return;const f=$('boardframe'),el=$('board');const w=Math.max(1,Math.floor(Math.min(f.clientWidth-16,(f.clientHeight-16)*round.w/round.h)));el.style.setProperty('--maze-width',w+'px');el.style.setProperty('--maze-ratio',round.w+'/'+round.h);el.style.setProperty('--maze-rows',round.h);}if(window.ResizeObserver)new ResizeObserver(fitBoard).observe($('boardframe'));window.addEventListener('resize',fitBoard);window.visualViewport?.addEventListener('resize',fitBoard);
let builtWall=null;function render(){const r=round;$('title').textContent='Niveau '+r.level;$('subtitle').textContent=WORLDS[Math.floor((r.level-1)/30)];$('moves').textContent=r.moves;$('keys').textContent=r.keys+'/1';$('treasure').textContent=(r.chest?1:0)+'/1';$('stars').textContent='★'.repeat(r.stars)+'☆'.repeat(3-r.stars);const el=$('board');if(builtWall!==r.wall){builtWall=r.wall;el.style.gridTemplateColumns='repeat('+r.w+',1fr)';el.innerHTML='';for(let i=0;i<r.wall.length;i++){const b=document.createElement('button');b.className='cell';b.dataset.cell=i;bg(b,r.wall[i]?'wall':r.traps.includes(i)?'spikes':'floor');b.tabIndex=-1;b.disabled=!!r.wall[i];el.append(b)}fitBoard()}const legal=adjacent(r.pos,r);for(let i=0;i<r.wall.length;i++){const b=el.children[i],cls='cell'+(r.wall[i]?' wall':'')+(r.pos===i?' player':'')+(hintPath.includes(i)?' hint':'')+(walkRoute.includes(i)?' walking':'')+(!r.wall[i]&&legal.includes(i)?' legal':'');if(b.className!==cls)b.className=cls;const obj=r.pos===i?'lumi':r.objects[i]||'';if(b.dataset.obj!==obj){b.dataset.obj=obj;b.replaceChildren();if(obj){const img=document.createElement('img');img.src=A[obj];img.alt='';img.draggable=false;b.append(img)}b.setAttribute('aria-label',r.wall[i]?'Mur':obj||'Case')}}}

function step(i){const r=round;if(!r||r.wall[i]||!adjacent(r.pos).includes(i)||r.moves<=0)return false;history.push(JSON.stringify(r));r.moves--;r.pos=i;hintPath=[];if(r.traps.includes(i)){r.moves=Math.max(0,r.moves-3);say('Piège ! Tu perds trois coups.')}else say('Trouve le chemin vers ton prochain objectif.');if(r.objects[i]==='key'){r.keys=1;delete r.objects[i];say('Clé trouvée ! Rejoins le coffre.')}else if(r.objects[i]==='chest'){if(r.keys){r.chest=true;delete r.objects[i];say('Coffre ouvert ! Rejoins le portail.')}else say('Ce coffre nécessite la clé.')}else if(r.objects[i]==='star'){r.stars++;delete r.objects[i];say('Étoile récoltée !')}render();if(i===r.exit&&r.chest){progress.stars[r.level]=Math.max(progress.stars[r.level]||0,r.stars);progress.level=Math.min(MAX,Math.max(progress.level,r.level+1));save();modal('Labyrinthe réussi !','<img class="treasure" src="'+A.chest+'"><p>Tu as libéré le portail et récolté '+r.stars+' étoile(s).</p>',[['Continuer',()=>start(Math.min(MAX,r.level+1))],['Les mondes',showMap]]);return false}if(r.moves<=0){modal('Plus de coups','<p>Essaie un autre itinéraire. Les pièges coûtent trois coups supplémentaires.</p>',[['Réessayer',()=>start(r.level)],['Accueil',home]]);return false}return true}
// Touch an unobstructed corridor, or swipe to the next junction. A route
// never traverses a wall, and every visited square costs its normal move.
let walkTimer=0,walkToken=0,walkRoute=[],touch=null;
function stopWalking(){walkToken++;clearTimeout(walkTimer);walkTimer=0;walkRoute=[];touch=null}
function playable(){return screen==='game'&&round&&round.moves>0&&$('modal').classList.contains('hidden')}
function openNeighbors(r,i){return adjacent(i,r).filter(j=>!r.wall[j])}
function straightOrCorridor(r,target){
 if(target===r.pos||r.wall[target])return [];
 const p=path(r,r.pos,target);if(p.length<2)return [];
 const sx=r.pos%r.w,sy=Math.floor(r.pos/r.w),tx=target%r.w,ty=Math.floor(target/r.w);
 const straight=(sx===tx||sy===ty)&&p.length-1===Math.abs(sx-tx)+Math.abs(sy-ty);
 if(straight||p.slice(1,-1).every(i=>openNeighbors(r,i).length===2))return p.slice(1);
 return [];
}
function corridor(r,dx,dy){let x=r.pos%r.w+dx,y=Math.floor(r.pos/r.w)+dy;if(x<0||y<0||x>=r.w||y>=r.h)return [];let prev=r.pos,i=y*r.w+x,out=[];if(r.wall[i])return out;while(!out.includes(i)&&i!==r.pos){out.push(i);if(r.objects[i]||r.traps.includes(i))break;const next=openNeighbors(r,i).filter(j=>j!==prev);if(next.length!==1)break;prev=i;i=next[0]}return out}
function walk(route){if(!playable()||!route.length)return;stopWalking();walkRoute=route.slice();const token=walkToken;function tick(){if(token!==walkToken||!playable()||!walkRoute.length){if(token===walkToken){walkRoute=[];if(screen==='game')render()}return}const next=walkRoute.shift();if(!step(next)){stopWalking();return}if(walkRoute.length)walkTimer=setTimeout(tick,88);else{walkTimer=0;render()}}tick()}
function moveTo(i){if(!playable()||round.wall[i])return;const p=straightOrCorridor(round,i);if(p.length)walk(p);else if(i!==round.pos)say('Choisis un passage jusqu’au prochain carrefour.')}
function direction(dx,dy){if(!playable())return;const p=corridor(round,dx,dy);if(p.length)walk(p);else say('Un mur bloque le passage.')}
const boardEl=$('board');function cellAt(x,y){const b=boardEl.getBoundingClientRect();if(x<b.left||x>=b.right||y<b.top||y>=b.bottom)return -1;const c=Math.min(round.w-1,Math.floor((x-b.left)/b.width*round.w)),row=Math.min(round.h-1,Math.floor((y-b.top)/b.height*round.h));return row*round.w+c}
boardEl.addEventListener('pointerdown',e=>{if(!playable()||e.button>0||touch)return;e.preventDefault();stopWalking();touch={id:e.pointerId,x:e.clientX,y:e.clientY};try{boardEl.setPointerCapture(e.pointerId)}catch{}});
boardEl.addEventListener('pointerup',e=>{if(!touch||touch.id!==e.pointerId)return;const t=touch;touch=null;e.preventDefault();if(!playable())return;const dx=e.clientX-t.x,dy=e.clientY-t.y;if(Math.max(Math.abs(dx),Math.abs(dy))>=14){direction(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0)}else{const i=cellAt(e.clientX,e.clientY);if(i>=0)moveTo(i)}});
boardEl.addEventListener('pointercancel',()=>{touch=null});boardEl.addEventListener('lostpointercapture',()=>{touch=null});
document.addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&playable()){e.preventDefault();direction(...d)}});
function undo(){stopWalking();if(!history.length)return;round=JSON.parse(history.pop());hintPath=[];render();say('Dernier déplacement annulé.')}function hint(){stopWalking();if(!round)return;if(progress.hints<=0){say('Plus d’indices. Le cadeau du jour peut en offrir.');return}let r=round,goal=!r.keys?r.key:!r.chest?r.treasure:r.exit;let avoid=new Set(r.traps);if(!r.keys)avoid.add(r.treasure);if(!r.chest)avoid.add(r.exit);let p=path(r,r.pos,goal,avoid);if(!p.length)p=path(r,r.pos,goal);hintPath=p.slice(1,7);progress.hints--;save();render();say('Lumi te montre les prochaines cases. Il reste '+progress.hints+' indice(s).')}
let mapBase=0;function showMap(){close();page('map');const nodes=$('nodes');nodes.innerHTML='';const loc=[[76,74],[56,68],[34,62],[17,58],[32,50],[86,41],[44,30],[14,22]];const base=mapBase||Math.floor((progress.level-1)/8)*8+1;for(let i=0;i<8;i++){const n=base+i;if(n>MAX)break;let b=document.createElement('button');b.className='mapnode'+(n>progress.level?' locked':'');b.style.left=loc[i][0]+'%';b.style.top=loc[i][1]+'%';b.textContent=n>progress.level?'·':n;b.disabled=n>progress.level;b.setAttribute('aria-label','Niveau '+n);b.onclick=()=>start(n);nodes.append(b)}$('mapprogress').innerHTML='★ '+Object.keys(progress.stars).length+' / '+MAX+' niveaux';$('mapPages').innerHTML='<button id="mapPrev" '+(base<=1?'disabled':'')+'>‹</button><span>'+base+'–'+Math.min(MAX,base+7)+'</span><button id="mapNext" '+(base+8>progress.level?'disabled':'')+'>›</button>';$('mapPrev').onclick=()=>{mapBase=Math.max(1,base-8);showMap()};$('mapNext').onclick=()=>{mapBase=base+8;showMap()}}function modal(title,body,actions){stopWalking();$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('actions').innerHTML='';for(const [t,fn]of actions){const b=document.createElement('button');b.className='goldbutton';b.textContent=t;b.onclick=fn;$('actions').append(b)}$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}function help(){modal('Le grimoire de Lumi','<p>Glisse le doigt dans une direction : Lumi avance jusqu’au prochain carrefour. Touche une case dans un passage accessible pour y aller directement. Chaque case parcourue coûte un coup. Récupère la clé puis le coffre avant de rejoindre le portail. Les étoiles sont facultatives et les pièges coûtent 3 coups. Le nombre de coups est calculé selon le chemin du labyrinthe.</p>',[['Compris',close]])}function showStats(){modal('Progression locale','<p>'+Object.keys(progress.stars).length+' niveaux réussis sur '+MAX+'. Le classement d’équipe n’est pas encore connecté.</p>',[['Retour',close]])}function gift(){let day=new Date().toLocaleDateString('fr-BE');if(progress.gift===day){modal('Cadeau de Lumi','<p>Le cadeau du jour a déjà été reçu.</p>',[['Retour',close]]);return}progress.gift=day;progress.hints+=2;save();home();modal('Cadeau de Lumi','<p>Deux indices supplémentaires !</p>',[['Merci',close]])}function about(){modal('Fantasy Adventure','<p>Fantasy Adventure · 120 labyrinthes à explorer avec Lumi.</p>',[['Retour',close]])}home();</script></body></html>
